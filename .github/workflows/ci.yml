# Typecheck and test every pull request, on macOS and Windows. Both are required: make "Test (macOS)" and
# "Test (Windows)" required checks in the branch protection rules.
#
# Pushes to master don't run this: release.yml runs the same steps (the shared action below) before it builds, and it is
# the workflow that runs on a merge. Note release.yml skips pushes that only touch docs, tests or dev scripts, so keep
# changes going through pull requests, where this always runs.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/typecheck-and-test
