# Tests every push or merge to master, and releases when the version has changed.
#
#   Every push to master:  typecheck and test on macOS and Windows (the same steps CI runs on pull requests).
#   New version:           if the version in the repo has no GitHub Release yet, the installers are built (build.yml:
#                          macOS Apple silicon and Intel, Windows x64 and ARM64) and published as release v<version>
#                          (the tag is created for you). So a release is just: bump the version
#                          (node scripts/version.mjs set 1.2.3), commit, merge to master.
#                          Pushes that don't change the version build and publish nothing. To check that everything
#                          still builds without releasing, run the Build workflow by hand (Actions -> Build).
#   Skipped entirely:      pushes that only touch docs (*.md), screenshots, tests or dev-only scripts (see
#                          paths-ignore below). Note a push mixing those with app changes still runs. Such changes
#                          are tested by CI on their pull request, so keep merging through pull requests.
#
# Signing is optional and is configured in build.yml (APPLE_* and WINDOWS_CERTIFICATE* secrets); the repository's
# secrets are passed on to it.
name: Release

on:
  push:
    branches: [master]
    # Only changes to the app (or to how it's built and versioned) run the workflow. Docs, screenshots, tests,
    # dev-only scripts and agent instructions can't change what ships, so they neither build nor release.
    paths-ignore:
      - "**/*.md"
      - "screenshots/**"
      - "packages/core/test/**"
      - "packages/ui/src/**/*.test.ts"
      - "packages/core/scripts/demo-traffic.mjs"
      - "scripts/dev.mjs"
      - "scripts/screenshots/**"
      - "scripts/gen-desktop-icons.py"
      - ".github/workflows/ci.yml"
      - ".gitignore"
      - "apps/desktop/.gitignore"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Is there anything to release? Only a version that has no GitHub Release yet is built and published.
  version:
    name: Is this version already released?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version already has a release, so nothing is built or published. Bump the version to release again."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Fails fast, before anything slow starts: every file that carries the version must agree, and the code must pass on
  # macOS and Windows. The steps are the same ones CI runs on pull requests (the shared action), so they can't drift apart.
  # Runs on every push, so two changes that pass separately but break each other are caught after they are merged.
  test:
    name: Typecheck and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/typecheck-and-test

  build:
    name: Build
    needs: [version, test]
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    name: Publish the release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-hub-*
          merge-multiple: true
          path: release

      - name: Checksums and notes
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<'EOF'
          ## Installing

          - **macOS:** open the `.dmg` for your Mac (`aarch64` is Apple silicon, `x64` is Intel) and drag MCP Hub to Applications.
          - **Windows:** run the `-setup.exe` for your PC (`x64` for most PCs, `arm64` for Snapdragon/ARM PCs). It installs for your user only, no administrator rights needed. The installer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC": choose **More info → Run anyway**.
          - If macOS says the app can't be opened because it is from an unidentified developer, this build isn't notarized yet: open **System Settings → Privacy & Security** and choose **Open Anyway** (on older macOS, right-click the app and choose **Open**). If it says the app is "damaged", run `xattr -cr "/Applications/MCP Hub.app"` and open it again.
          - Check a download against `SHA256SUMS.txt` with `shasum -a 256 <file>` (macOS) or `Get-FileHash <file>` (Windows PowerShell).
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          fail_on_unmatched_files: true
