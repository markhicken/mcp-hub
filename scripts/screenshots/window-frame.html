<!doctype html>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  .stage { display: inline-block; padding: 28px 36px 48px; }
  .window {
    width: {{WIDTH}}px;
    overflow: hidden;
    border-radius: 12px;
    background: #1e1e20;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 0 0 2px rgba(0, 0, 0, 0.55), 0 24px 60px rgba(0, 0, 0, 0.45), 0 8px 18px rgba(0, 0, 0, 0.3);
  }
  .bar {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    background: linear-gradient(#3b3b3e, #2e2e30);
    border-bottom: 1px solid rgba(0, 0, 0, 0.75);
  }
  .lights { display: flex; gap: 8px; padding-left: 13px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.3); }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .title {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #d6d6d8;
    pointer-events: none;
  }
  img { display: block; width: {{WIDTH}}px; height: {{HEIGHT}}px; }
</style>
<div class="stage">
  <div class="window">
    <div class="bar"><div class="lights"><i></i><i></i><i></i></div><div class="title">{{TITLE}}</div></div>
    <img alt="" src="{{IMAGE}}" />
  </div>
</div>
